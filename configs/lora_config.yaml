# FloraQwen QLoRA 微调配置 (Unsloth 后端)
# 用法: python scripts/train_lora.py --config configs/lora_config.yaml

# ---- 模型与数据 ----
# 首选 Qwen3-VL-4B (8GB 可微调); 若工具链不兼容, 回退 Qwen2.5-VL-3B-Instruct
model_name: Qwen/Qwen3-VL-4B-Instruct
data_path: data/processed/train.json
output_dir: models/lora-qwen3vl-4b-flora

# ---- LoRA 参数 (8GB 显存友好) ----
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  use_gradient_checkpointing: unsloth   # 显存关键优化
  random_state: 42

# ---- 训练参数 (batch=1 + 梯度累积, 8GB 可行) ----
training:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16       # 等效 batch 16, 显存不变
  num_train_epochs: 3
  learning_rate: 1.0e-4
  max_seq_length: 2048                  # 图像 token 占大头, 过高会 OOM
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  logging_steps: 5
  save_steps: 100
  save_total_limit: 2
  seed: 42
  # bf16: RTX 4060 支持, 比 fp16 更稳; 由脚本按 is_bfloat16_supported() 自动选择
  # fp16: false

# ---- 保存策略 ----
merge_on_save: true      # 保存时合并 LoRA 到基座 (4-bit 下会以 bf16 精度保存, 文件较大)
                         # 若磁盘紧张, 改为 false 只保存 adapter (数百 MB)
